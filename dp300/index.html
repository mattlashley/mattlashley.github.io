*{box-sizing:border-box}html{background:var(--paper)}body{margin:0;color:var(--ink);background:var(--paper);font:15px/1.55 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}.app{min-height:100vh}.top{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}.topin{height:68px;max-width:1040px;margin:auto;display:flex;align-items:center;justify-content:space-between;padding:0 20px}.brand{display:flex;align-items:center;gap:11px;font-weight:800;letter-spacing:.02em}.logo{width:39px;height:39px;border-radius:11px;background:var(--ink);color:var(--lime);display:grid;place-items:center;font-size:20px}.brand small{display:block;color:var(--muted);font-size:9px;letter-spacing:.14em}.sync{font-size:11px;color:var(--muted)}main{max-width:920px;margin:auto;padding:30px 20px 100px}.eyebrow{font-size:10px;letter-spacing:.16em;font-weight:800;color:var(--green);text-transform:uppercase}.hero{background:var(--ink);color:#fff;border-radius:18px;padding:30px;margin-bottom:22px}.hero h1{margin:7px 0 10px;font-size:clamp(30px,6vw,48px);line-height:1.02;letter-spacing:-.05em}.hero p{max-width:690px;color:#d1ddd7;margin:0}.hero strong{color:var(--lime)}h2{font-size:24px;line-height:1.15;letter-spacing:-.03em;margin:0 0 10px}h3{margin:0 0 8px;font-size:18px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0}.metric{background:#fff;border:1px solid var(--line);padding:15px;border-radius:12px}.metric strong{font-size:25px;display:block;line-height:1.15}.metric span{font-size:10px;color:var(--muted)}.btn{border:1px solid #cad6cc;background:#fff;color:var(--ink);border-radius:9px;min-height:45px;padding:10px 15px;font-weight:700}.btn:hover{background:#eef3e8}.primary{background:var(--green);color:#fff;border-color:var(--green)}.primary:hover{background:var(--green2)}.wide{width:100%}.mode{display:block;text-align:left;padding:18px}.mode small{display:block;color:var(--muted);font-weight:500;margin-top:4px}.mode b{font-size:16px}.domainrow{display:grid;grid-template-columns:1fr 90px 110px;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}.domainrow:last-child{border-bottom:0}.bar{height:7px;background:#e8ede7;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--green)}.score{text-align:right;font-weight:800}.small{font-size:12px;color:var(--muted)}.tag{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.05em;background:#edf2e6;color:var(--green);border-radius:6px;padding:5px 8px}.tag.hard{background:#f4e8d9;color:#795124}.question{max-width:790px;margin:0 auto}.qtop{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:15px}.progress{height:7px;background:#e5ebe4;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:var(--green);transition:width .2s}.prompt{font-size:23px;line-height:1.35;letter-spacing:-.025em;margin:18px 0 20px;font-weight:800}.choices{display:grid;gap:9px}.choice{width:100%;display:flex;align-items:flex-start;gap:12px;text-align:left;border:1px solid #cbd7cd;background:#fff;border-radius:10px;padding:14px;color:var(--ink);min-height:56px}.choice:hover:not(:disabled){background:#f0f5ea}.choice span:first-child{flex:0 0 28px;width:28px;height:28px;border-radius:7px;background:#edf2e9;display:grid;place-items:center;font-size:12px;font-weight:800}.choice.correct{border:2px solid #4e8a65;background:var(--good)}.choice.wrong{border:2px solid #b9675b;background:var(--red)}.choice:disabled{cursor:default;opacity:1}.feedback{margin-top:18px;border-radius:12px;padding:20px}.feedback.good{background:var(--good);color:var(--goodInk)}.feedback.bad{background:var(--red);color:var(--redInk)}.feedback p{color:inherit}.feedback .answerline{font-weight:800;margin:0 0 7px}.memory{background:#fff;border-left:4px solid var(--green);padding:12px 14px;margin-top:14px;color:var(--ink);border-radius:4px}.confidence{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.confidence .btn.selected{background:var(--ink);color:#fff;border-color:var(--ink)}.nextbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:18px}.login{max-width:470px;margin:60px auto}.login input{width:100%;min-height:48px;padding:11px;border:1px solid #cbd7cd;border-radius:8px;margin:6px 0 12px}.login label{font-size:12px;font-weight:700}.notice{position:sticky;top:68px;z-index:18;background:#fff1c7;border-bottom:1px solid #dfc986;color:#654b11;padding:10px 20px;text-align:center;font-size:12px}.tabs{display:flex;gap:5px;overflow:auto;margin-bottom:18px}.tabs button{white-space:nowrap;border:0;background:transparent;padding:9px 12px;border-radius:8px;color:var(--muted);font-weight:700}.tabs button.active{background:#e8efe1;color:var(--ink)}select{border:1px solid #cbd7cd;border-radius:8px;background:#fff;min-height:44px;padding:8px 10px;color:var(--ink);width:100%}.resultbig{text-align:center;padding:15px 0}.resultbig strong{font-size:48px;display:block;letter-spacing:-.05em}.mistakes{display:grid;gap:8px}.mistake{padding:12px;border:1px solid var(--line);border-radius:9px}.footerNote{font-size:11px;color:var(--muted);margin-top:35px}.spinner{width:24px;height:24px;border:3px solid #dce4dc;border-top-color:var(--green);border-radius:50%;animation:spin 1s linear infinite;margin:50px auto}@keyframes spin{to{transform:rotate(360deg)}}

<body>

<div id="app" class="app"><div class="spinner"></div></div>
<script>
'use strict';
const SB_URL='https://ilskeyawxpzbahjppllq.supabase.co';
const SB_KEY='sb_publishable_8HcMuyf-8HPeitFE6Or4QA_Tcnp9Xrf';
const DOMAIN={
 platform:{name:'Platform & migration',weight:'15–20%',quota:3},
 security:{name:'Security',weight:'20–25%',quota:4},
 performance:{name:'Performance',weight:'20–25%',quota:5},
 automation:{name:'Automation',weight:'15–20%',quota:3},
 recovery:{name:'HA / DR',weight:'20–25%',quota:5}
};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let sb=null,user=null,questions=[],events=[],tab='home',session=null,answered=null,pendingConfidence=null,preview=false;
const uid=()=>user?.id||'preview';
const cacheKey=()=>`matt-dp300-v1-${uid()}`;
function notice(msg){const e=$('#notice');if(!e)return;e.textContent=msg;e.classList.toggle('hidden',!msg)}
function shuffled(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function localEvents(){try{return JSON.parse(localStorage.getItem(cacheKey())||'[]')}catch{return[]}}
function saveLocal(){localStorage.setItem(cacheKey(),JSON.stringify(events.slice(-2500)))}
function answers(){return events.filter(e=>e.kind==='dp300_answer')}
function history(id){return answers().filter(e=>e.item_id===id).sort((a,b)=>a.created_at.localeCompare(b.created_at))}
function lastAttempt(id){return history(id).at(-1)}
function distinctGoodDays(id){return new Set(history(id).filter(e=>e.payload.correct&&e.payload.confidence==='knew').map(e=>e.created_at.slice(0,10))).size}
function dueAt(q){const h=history(q.id);if(!h.length)return 0;const last=h.at(-1),p=last.payload||{},t=new Date(last.created_at).getTime();let ms;
 if(!p.correct||p.confidence==='guess')ms=10*60e3;
 else if(p.confidence==='narrowed')ms=4*60*60e3;
 else ms=(distinctGoodDays(q.id)>=2?36:18)*60*60e3;
 return t+ms;
}
function isDue(q){return history(q.id).length>0&&dueAt(q)<=Date.now()}
function qScore(q){const h=history(q.id);if(!h.length)return 0;let s=0;for(const e of h.slice(-4)){const p=e.payload||{};s+=(p.correct?(p.confidence==='knew'?1:p.confidence==='narrowed'?.7:.35):-1)}return Math.max(0,Math.min(1,(s+2)/5))}
function domainStats(d){const qs=questions.filter(q=>q.domain===d),hs=answers().filter(e=>e.payload.domain===d);const seen=new Set(hs.map(e=>e.item_id)).size;const correct=hs.filter(e=>e.payload.correct).length;const mastery=qs.length?Math.round(qs.reduce((s,q)=>s+qScore(q),0)/qs.length*100):0;return {total:qs.length,seen,attempts:hs.length,accuracy:hs.length?Math.round(correct/hs.length*100):null,mastery}}
function overall(){const a=answers(),seen=new Set(a.map(e=>e.item_id)).size,correct=a.filter(e=>e.payload.correct).length,due=questions.filter(isDue).length;return {attempts:a.length,seen,accuracy:a.length?Math.round(correct/a.length*100):null,due}}
function firstAttemptTime(){const a=answers();return a.length?new Date(a[0].created_at).getTime():Date.now()}
function cramDay(){return Math.min(3,Math.floor((Date.now()-firstAttemptTime())/86400000)+1)}
async function recordAnswer(q,selected,confidence,mode){const e={id:crypto.randomUUID(),kind:'dp300_answer',item_id:q.id,payload:{correct:selected===q.correct_index,selected,correct_index:q.correct_index,domain:q.domain,objective:q.objective,difficulty:q.difficulty,confidence,mode,trainer:'dp300-cram-v1'},created_at:new Date().toISOString()};if(user)e.user_id=user.id;events.push(e);saveLocal();updateSync();if(user){const {error}=await sb.from('dba_learning_events').insert(e);if(error)notice('Saved on this device; cloud sync failed: '+error.message)}updateSync()}
async function loadCloud(){if(!user){events=localEvents();return}const {data,error}=await sb.from('dba_learning_events').select('*').eq('kind','dp300_answer').order('created_at');if(error)throw error;const local=localEvents(),m=new Map((data||[]).map(e=>[e.id,e]));local.forEach(e=>m.set(e.id,e));events=[...m.values()].sort((a,b)=>a.created_at.localeCompare(b.created_at));saveLocal()}
async function loadQuestions(){const {data,error}=await sb.from('dba_questions').select('*').eq('active',true).order('domain').order('id');if(error)throw error;questions=data||[];if(questions.length<50)throw new Error('Question bank did not load completely.')}
function updateSync(){const e=$('#sync');if(e)e.textContent=user?'Progress → Supabase':preview?'Preview → this device':'Not signed in'}
function shell(){return `<header class="top"><div class="topin"><div class="brand"><span class="logo">M</span><span>MATT <small>DP-300 CRAM TRAINER</small></span></div><span id="sync" class="sync"></span></div></header><main><div class="tabs"><button data-t="home" onclick="go('home')">Today</button><button data-t="practice" onclick="go('practice')">Practice</button><button data-t="progress" onclick="go('progress')">Progress</button><button data-t="account" onclick="go('account')">Account</button></div><div id="view"></div></main>`}
function setShell(){ $('#app').innerHTML=shell(); updateSync(); render() }
function go(t){tab=t;session=null;answered=null;pendingConfidence=null;render();window.scrollTo(0,0)}
function activateTab(){document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.t===tab))}
function render(){activateTab();const v=$('#view');if(!v)return;if(session){renderQuestion();return}if(tab==='home')renderHome();else if(tab==='practice')renderPractice();else if(tab==='progress')renderProgress();else renderAccount()}
function renderHome(){const o=overall(),day=cramDay();const weak=Object.keys(DOMAIN).sort((a,b)=>domainStats(a).mastery-domainStats(b).mastery)[0];$('#view').innerHTML=`
<section class="hero"><div class="eyebrow">3-DAY EXAM CRAM · DAY ${day}</div><h1>Recall it.<br><strong>Explain it.</strong></h1><p>Hard, scenario-based DP-300 practice. Every answer is graded immediately, then scheduled again based on whether you actually knew it.</p></section>
<div class="metrics"><div class="metric"><strong>${o.seen}/75</strong><span>questions touched</span></div><div class="metric"><strong>${o.accuracy??'—'}${o.accuracy===null?'':'%'}</strong><span>attempt accuracy</span></div><div class="metric"><strong>${o.due}</strong><span>due now</span></div><div class="metric"><strong>${day}/3</strong><span>cram day</span></div></div>
<div class="grid"><button class="btn primary mode" onclick="start('mix')"><b>Start Exam Mix · 20</b><small>Weighted across the current DP-300 domains.</small></button><button class="btn mode" onclick="start('due')"><b>Review Due Now</b><small>Misses and shaky answers come back first.</small></button><button class="btn mode" onclick="start('weak')"><b>Attack Weak Spots</b><small>Adaptive set from your lowest-retention material.</small></button><button class="btn mode" onclick="start('domain','${weak}')"><b>Focus: ${DOMAIN[weak].name}</b><small>Your lowest bank-mastery domain right now.</small></button></div>
<div class="card"><h2>Three-day attack plan</h2><p><b>Day 1:</b> diagnostic mix + Security + Performance. <b>Day 2:</b> Automation + HA/DR + every due miss. <b>Day 3:</b> mixed sets, missed-only, and explanations until the wrong answers stop repeating.</p><p class="small">A high score in this bank is useful evidence of recall, not a guarantee of an exam result.</p></div>
${domainPanel()}
<div class="footerNote">75 original practice questions aligned to Microsoft's current DP-300 skills outline. These are training questions, not copied exam items.</div>`}
function domainPanel(){return `<div class="card"><h2>Domain mastery</h2>${Object.entries(DOMAIN).map(([id,d])=>{const s=domainStats(id);return `<div class="domainrow"><div><b>${d.name}</b><div class="small">Exam weight ${d.weight} · ${s.seen}/${s.total} seen</div></div><div class="score">${s.mastery}%</div><div class="bar"><i style="width:${s.mastery}%"></i></div></div>`}).join('')}</div>`}
function renderPractice(){ $('#view').innerHTML=`<div class="card"><div class="eyebrow">PRACTICE MODES</div><h2>Choose what to attack.</h2><div class="grid"><button class="btn mode" onclick="start('mix')"><b>Exam Mix · 20</b><small>Blueprint-weighted scenarios.</small></button><button class="btn mode" onclick="start('due')"><b>Due Now</b><small>Spaced retrieval queue.</small></button><button class="btn mode" onclick="start('weak')"><b>Weak Spots · 15</b><small>Lowest confidence and accuracy first.</small></button><button class="btn mode" onclick="start('missed')"><b>Missed Only</b><small>Questions you've answered incorrectly.</small></button></div></div><div class="card"><h2>Practice one domain</h2><div class="grid">${Object.entries(DOMAIN).map(([id,d])=>`<button class="btn mode" onclick="start('domain','${id}')"><b>${d.name}</b><small>${d.weight} of exam · ${domainStats(id).seen}/15 seen</small></button>`).join('')}</div></div>`}
function chooseMix(){let out=[];for(const [d,meta] of Object.entries(DOMAIN)){let pool=questions.filter(q=>q.domain===d).sort((a,b)=>(isDue(b)-isDue(a))||(qScore(a)-qScore(b)));const top=pool.slice(0,Math.max(meta.quota*2,meta.quota));out.push(...shuffled(top).slice(0,meta.quota))}return shuffled(out)}
function weakPool(n=15){return questions.slice().sort((a,b)=>{const ad=isDue(a)?-1:0,bd=isDue(b)?-1:0;if(ad!==bd)return ad-bd;return qScore(a)-qScore(b)}).slice(0,n)}
function start(mode,domain=null){let list=[];if(mode==='mix')list=chooseMix();if(mode==='due')list=questions.filter(isDue).sort((a,b)=>dueAt(a)-dueAt(b)).slice(0,20);if(mode==='weak')list=weakPool(15);if(mode==='missed'){const ids=new Set(answers().filter(e=>!e.payload.correct).map(e=>e.item_id));list=questions.filter(q=>ids.has(q.id)).sort((a,b)=>qScore(a)-qScore(b)).slice(0,25)}if(mode==='domain')list=shuffled(questions.filter(q=>q.domain===domain)).sort((a,b)=>(isDue(b)-isDue(a))||(qScore(a)-qScore(b)));if(!list.length){notice('Nothing is due in that mode yet. Try Exam Mix or a domain set.');return}session={mode,domain,list,index:0,correct:0,results:[],started:Date.now()};answered=null;pendingConfidence=null;render();window.scrollTo(0,0)}
function currentQ(){return session?.list[session.index]}
function renderQuestion(){const q=currentQ();if(!q){finishSession();return}const letter=['A','B','C','D'];const done=answered!==null;$('#view').innerHTML=`<div class="question"><div class="qtop"><span class="tag ${q.difficulty===3?'hard':''}">${esc(DOMAIN[q.domain].name)} · ${esc(q.objective)}</span><span class="small">${session.index+1}/${session.list.length}</span></div><div class="progress"><i style="width:${(session.index/session.list.length)*100}%"></i></div><div class="prompt">${esc(q.prompt)}</div><div class="choices">${q.options.map((o,i)=>{let c='choice';if(done&&i===q.correct_index)c+=' correct';if(done&&i===answered&&i!==q.correct_index)c+=' wrong';return `<button class="${c}" ${done?'disabled':''} onclick="answer(${i})"><span>${letter[i]}</span><span>${esc(o)}</span></button>`}).join('')}</div>${done?feedback(q):''}</div>`}
function answer(i){if(answered!==null)return;answered=i;pendingConfidence=null;if(i===currentQ().correct_index)session.correct++;renderQuestion();window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'})}
function feedback(q){const ok=answered===q.correct_index;return `<div class="feedback ${ok?'good':'bad'}"><p class="answerline">${ok?'Correct.':'Not quite.'} Answer: ${esc(q.options[q.correct_index])}</p><p>${esc(q.explanation)}</p><div class="memory"><b>Memory hook:</b> ${esc(q.memory_hook||'Explain the rule in your own words before moving on.')}</div><p class="small"><b>How did that answer feel?</b> Be strict. Guessing correctly should come back quickly.</p><div class="confidence"><button class="btn ${pendingConfidence==='knew'?'selected':''}" onclick="confidence('knew')">Knew it</button><button class="btn ${pendingConfidence==='narrowed'?'selected':''}" onclick="confidence('narrowed')">Narrowed it down</button><button class="btn ${pendingConfidence==='guess'?'selected':''}" onclick="confidence('guess')">Guessed</button></div><div class="nextbar"><span class="small">${!ok||pendingConfidence==='guess'?'This will return quickly.':'Strong recall earns a longer interval.'}</span><button class="btn primary" onclick="nextQuestion()">${session.index===session.list.length-1?'Finish set':'Next question →'}</button></div></div>`}
function confidence(c){pendingConfidence=c;renderQuestion()}
async function nextQuestion(){if(answered===null)return;const q=currentQ(),conf=pendingConfidence||'narrowed';const result={id:q.id,correct:answered===q.correct_index,selected:answered,confidence:conf,domain:q.domain};session.results.push(result);await recordAnswer(q,answered,conf,session.mode);session.index++;answered=null;pendingConfidence=null;if(session.index>=session.list.length)finishSession();else{renderQuestion();window.scrollTo(0,0)}}
function finishSession(){const s=session;if(!s)return;const pct=s.list.length?Math.round(s.results.filter(r=>r.correct).length/s.list.length*100):0;const missed=s.results.filter(r=>!r.correct);session=null;$('#view').innerHTML=`<div class="card resultbig"><div class="eyebrow">SET COMPLETE</div><strong>${pct}%</strong><p>${s.results.filter(r=>r.correct).length} of ${s.list.length} correct · ${Math.max(1,Math.round((Date.now()-s.started)/60000))} min</p><button class="btn primary" onclick="start('due')">Review what is due</button><button class="btn" onclick="go('home')">Back to dashboard</button></div>${missed.length?`<div class="card"><h2>Misses from this set</h2><div class="mistakes">${missed.map(r=>{const q=questions.find(x=>x.id===r.id);return `<div class="mistake"><b>${esc(q.prompt)}</b><div class="small">Correct: ${esc(q.options[q.correct_index])}</div></div>`}).join('')}</div></div>`:''}${domainPanel()}`}
function renderProgress(){const o=overall();$('#view').innerHTML=`<div class="metrics"><div class="metric"><strong>${o.attempts}</strong><span>total attempts</span></div><div class="metric"><strong>${o.seen}/75</strong><span>unique questions</span></div><div class="metric"><strong>${o.accuracy??'—'}${o.accuracy===null?'':'%'}</strong><span>attempt accuracy</span></div><div class="metric"><strong>${o.due}</strong><span>due now</span></div></div>${domainPanel()}<div class="card"><h2>What “mastery” means here</h2><p>It rewards correct recall across time and penalizes misses and guesses. Same-day familiarity is intentionally worth less than retrieving the answer after a delay.</p><p class="small">Use Microsoft Learn and hands-on Azure/SQL practice alongside this bank. The exam can test skills beyond any fixed question set.</p></div>`}
function renderAccount(){ $('#view').innerHTML=`<div class="card"><h2>${user?'Signed in':'Preview mode'}</h2><p>${user?'Your DP-300 answer history is syncing to the existing LifeOS Supabase project.':'Your progress is stored only in this browser. Sign in to sync it across devices.'}</p>${user?`<button class="btn" onclick="logout()">Sign out</button>`:`<button class="btn primary" onclick="showLogin()">Sign in</button>`}</div><div class="card"><h2>Question bank</h2><p><b>${questions.length}</b> active original scenario questions loaded from Supabase.</p><p class="small">Coverage follows the current DP-300 skills outline: platform/migration, security, performance, automation, and high availability/disaster recovery.</p></div>`}
function loginScreen(){return `<main class="login"><div class="eyebrow">MATT · DP-300</div><h1 style="font-size:42px;letter-spacing:-.05em;line-height:1.05">Three days.<br>Make them count.</h1><div class="card"><h2>Sign in</h2><p>Use the same account as your existing MATT/LifeOS training app.</p><form id="loginForm"><label>Email<input id="email" type="email" autocomplete="username" required></label><label>Password<input id="password" type="password" autocomplete="current-password" required></label><button class="btn primary wide" id="loginBtn">Sign in & train</button></form><button class="btn wide" onclick="enterPreview()">Use local preview</button><p class="small">Preview answers stay on this device.</p></div></main>`}
function showLogin(){user=null;preview=false;$('#app').innerHTML=loginScreen();$('#loginForm').onsubmit=login}
async function login(e){e.preventDefault();const b=$('#loginBtn');b.disabled=true;notice('');const {data,error}=await sb.auth.signInWithPassword({email:$('#email').value.trim(),password:$('#password').value});b.disabled=false;if(error){notice(error.message);return}user=data.user;preview=false;await loadCloud();setShell()}
async function logout(){await sb.auth.signOut();user=null;events=[];preview=false;showLogin()}
async function enterPreview(){preview=true;user=null;events=localEvents();setShell()}
async function boot(){try{if(!window.supabase)throw new Error('Supabase client library did not load.');sb=window.supabase.createClient(SB_URL,SB_KEY);await loadQuestions();const {data}=await sb.auth.getSession();user=data?.session?.user||null;if(user){await loadCloud();setShell()}else showLogin()}catch(e){$('#app').innerHTML=`<main class="login"><div class="card"><h2>Could not start trainer</h2><p>${esc(e.message)}</p><button class="btn" onclick="location.reload()">Reload</button></div></main>`}}
window.addEventListener('DOMContentLoaded',()=>boot());
</script>
</body>
</html>
